<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="alternate icon" type="image/png" href="{{ '/assets/images/logo.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/logo.png' | relative_url }}">
<style>
  /* Theme base is $doc-font-size: 16px, set on html -- every heading,
     paragraph, and spacing unit elsewhere is em/rem-relative to this,
     so shrinking it here scales the whole site's type proportionally
     rather than needing separate overrides per element. */
  html {
    font-size: 14px !important;
  }
  .author__urls-note {
    white-space: normal !important;
    word-break: normal !important;
    line-height: 1.5;
  }
  /* Both compiled stylesheets (main.css, main-light.css) declare the same
     "intro" fade-in animation on #main/.masthead/.page__footer/etc.
     Toggling which stylesheet is active restarts/interrupts it, which can
     leave an element stuck at the animation's 0% frame (opacity: .01,
     effectively invisible) instead of settling at 100% (opacity: 1). It's
     decorative only, so just disable it everywhere. */
  #main, .masthead, .page__footer, .page__hero, .search-content__inner-wrap {
    animation: none !important;
    opacity: 1 !important;
  }
  /* Deliberately not .search__toggle -- main.min.js binds a jQuery click
     handler to that exact class (search overlay open/close) regardless of
     site.search, and it was firing on this button too, toggling
     .initial-content's is--hidden class and collapsing the whole page. */
  .theme__toggle {
    margin-inline: 1rem;
    height: 2rem;
    border: 0;
    outline: none;
    background-color: transparent;
    cursor: pointer;
    color: inherit;
    transition: 0.2s;
  }
  .theme__toggle:hover {
    opacity: 0.7;
  }
  /* Code blocks: smaller than the theme's own .75em default, and a
     2-space tab-size -- Go/Bil source (gofmt) indents with real tab
     characters, which render at the browser default of 8 columns wide
     with no tab-size set anywhere in the theme, making nested code look
     far more indented than the source actually is. */
  .highlight, .highlight pre, .highlight code {
    font-size: 0.7em !important;
    tab-size: 2;
    -moz-tab-size: 2;
  }
</style>

<!-- Light/dark toggle: assets/css/main.css (dark, this site's default
     skin) always loads; assets/css/main-light.css is a full second
     stylesheet compiled from the theme's own "default" skin, loaded
     disabled and enabled at runtime -- MM skins compile to fixed
     values, so this is the simplest way to offer both from one theme.
     Applied synchronously (not on DOMContentLoaded) so a stored "light"
     preference takes effect before first paint, not after. -->
<link id="theme-light-css" rel="stylesheet" href="{{ '/assets/css/main-light.css' | relative_url }}" disabled>
<script>
  (function () {
    var KEY = 'bil-theme';
    var lightCss = document.getElementById('theme-light-css');

    function apply(theme) {
      lightCss.disabled = theme !== 'light';
      document.documentElement.setAttribute('data-theme', theme);
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        var icon = btn.querySelector('i');
        if (icon) icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
      }
    }

    var theme = localStorage.getItem(KEY) || 'dark';
    apply(theme); // sets the stylesheet before first paint; #theme-toggle doesn't exist yet in <head>, so its icon is fixed up below once it does

    document.addEventListener('DOMContentLoaded', function () {
      apply(theme);
    });

    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('#theme-toggle');
      if (!btn) return;
      theme = theme === 'light' ? 'dark' : 'light';
      localStorage.setItem(KEY, theme);
      apply(theme);
    });
  })();
</script>
